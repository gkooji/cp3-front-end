<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato - Lojinha Maneira</title>
  <meta name="description" content="Entre em contato com a Lojinha Maneira. Tire dúvidas, faça pedidos ou envie sugestões." />
  <link rel="stylesheet" href="/src/css/estilo.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">🎮 Lojinha Maneira</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html">Portfólio</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
  </nav>

  <main>
    <h1>Fale Conosco</h1>
    <p style="text-align:center">Tem alguma dúvida, sugestão ou quer fazer um orçamento? Preencha o formulário abaixo.</p>

    <form id="contact-form" class="form" novalidate>
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required />

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com" required />

      <label for="descricao">Descrição / Mensagem</label>
      <textarea id="descricao" name="descricao" placeholder="Conte como podemos te ajudar..." required></textarea>

      <button type="submit" class="btn">Enviar mensagem</button>
      <div id="form-msg" class="form-msg"></div>
    </form>
  </main>

  <footer id="footer"></footer>
  <script src="/src/js/script.js"></script>
</body>
</html>
